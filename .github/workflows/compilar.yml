name: Compilar JARVIS para Windows

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: write

# si subo varios cambios seguidos, solo se compila el último (evita choques al publicar)
concurrency:
  group: compilar-windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Leer la versión
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path config.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          "numero=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versión $v"

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Descargar cloudflared (acceso remoto)
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile cloudflared.exe

      - name: Crear JARVIS.exe
        run: python -m PyInstaller --noconfirm --clean JARVIS.spec

      - name: Autoprueba del .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\JARVIS\JARVIS.exe" -ArgumentList "--autotest","autotest.txt" -Wait -PassThru
          Get-Content autotest.txt
          if ($p.ExitCode -ne 0) { throw "La autoprueba del .exe falló (código $($p.ExitCode))" }

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Crear el instalador JARVIS_Setup.exe
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          & $iscc instalador.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló" }
          Get-ChildItem salida

      - name: Guardar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS_Setup
          path: salida/JARVIS_Setup.exe

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.numero }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: salida/JARVIS_Setup.exe
          name: J.A.R.V.I.S. ${{ steps.version.outputs.numero }}
          body: |
            ## Instalación
            1. Descarga **JARVIS_Setup.exe** (abajo, en *Assets*) y ábrelo.
            2. Si Windows muestra "Windows protegió su PC": **Más información → Ejecutar de todas formas** (el programa no está firmado).
            3. Al abrir JARVIS por primera vez, pega tu clave gratis de **Groq** (y opcionalmente la de **Gemini**).

            ## Novedades
            - **Aprendizaje mutuo**: JARVIS guarda en una base de datos lo que aprende de ti (gustos, datos, hábitos, correcciones) y lo que te enseña.
            - **Órdenes que se aprenden solas**: si le pides algo dos veces, a la tercera lo hace al instante. Dile «no, así no» y lo olvida.
            - «¿Qué sabes de mí?», «¿Qué aprendimos hoy?» y «Hazme un repaso» (te pregunta lo que te enseñó).
            - Retoma el hilo de la conversación aunque reinicies la PC.
            - Nueva pestaña **Aprendizaje** en el Centro de control: ve, corrige o enséñale cosas.
            - **Spotify de verdad**: «pon Queen en Spotify» abre Spotify y le da play (Centro de control → General → La música suena en).
            - La voz de Jorge vuelve a su velocidad normal.
            - Voz opcional de **ElevenLabs** (voces británicas tipo mayordomo, cuenta gratis); si se acaban los créditos vuelve Jorge.
            - Más fluido: responde antes al terminar de hablar y las frases cortas se dicen al instante.
            - Lee páginas web: «resúmeme esta página» lee la pestaña que tienes abierta.
